name: NEXORA CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Typecheck, Build, Tests & Security Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run unit and server security tests
        run: npm test

      - name: Run static Firestore security rules assertions
        run: npm run test:rules

      - name: Lint Firestore security rules
        run: npm run rules:lint

      - name: Build production frontend bundle
        run: npm run build
